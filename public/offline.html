<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <title>Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1120; color: #f8fafc; font-family: Inter, system-ui, sans-serif; }
    .card { width: min(92vw, 420px); padding: 2rem; border-radius: 24px; background: rgba(11, 17, 32, .84); border: 1px solid rgba(255,255,255,.1); text-align: center; }
    .muted { color: #7d8a9a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p class="muted">The app is still available for cached content. Please reconnect to refresh data.</p>
  </div>
</body>
</html>
